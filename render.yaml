services:
  # ─── FastAPI Python Backend Web Service on Render ─────────────────────────────
  - type: web
    name: projectguide-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: ProjectGuide-AI
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: groq/llama-3.3-70b-versatile

